[tools]
bun = "latest"
hk = "latest"
pkl = "latest"
rust = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.build]
description = "Build the Rust formatter"
run = "cargo build --release"

[tasks.checks]
description = "Run all checks (formatting, linting)"
depends = ["format:check", "lint", "test"]

[tasks.format]
description = "Format Rust code"
run = "cargo fmt"

[tasks."format:check"]
description = "Check Rust code formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Lint Rust code with Clippy"
run = "cargo clippy -- --deny warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.install]
description = "Install to PATH"
run = "cargo install --path ."
