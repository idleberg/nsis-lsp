[package]
name = "nsis-lsp"
version = "0.2.0"
description = "An opinionated language server for NSIS"
authors = ["Jan T. Sott"]
repository = "https://github.com/idleberg/language-server-protocol"
license = "MIT OR Apache-2.0"
edition = "2024"

[[bin]]
name = "nsis-lsp"
path = "src/main.rs"

[dependencies]
ardent = "0.3"
lsp-server = "0.7"
lsp-types = "0.97"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
