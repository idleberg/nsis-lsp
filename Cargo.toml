[package]
name = "nsis-lsp"
version = "0.5.1"
description = "An opinionated language server for NSIS"
authors = ["Jan T. Sott"]
repository = "https://github.com/idleberg/nsis-lsp"
license = "MIT OR Apache-2.0"
edition = "2024"

[[bin]]
name = "nsis-lsp"
path = "src/main.rs"

[dependencies]
ardent = "0.12"
clap = { version = "4.6.4", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
